[project]
name = "synapse-showcase"
version = "0.1.0"
description = "Learn MCP apps through a shared guide and practice board"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
authors = [
    { name = "NimbleBrain Inc", email = "hello@nimblebrain.ai" },
]
keywords = ["mcp", "synapse", "guide", "onboarding", "nimblebrain"]
dependencies = [
    # The release bundle installs from these constraints, not uv.lock, so the
    # exact pin is what keeps the FastMCP the tests ran against in the .mcpb.
    "fastmcp==3.4.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synapse_showcase"]

[dependency-groups]
dev = [
    "ruff>=0.13.1",
    "ty>=0.0.1a1",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
